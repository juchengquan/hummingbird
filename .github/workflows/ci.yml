# CI — runs on every push to main and every PR.
#
# All gates hard-fail:
#   - typecheck       (`bunx tsc --noEmit`)
#   - lint            (`bun run lint`)
#   - build           (`bun run build`)
#   - bundle audit    (`bun run audit:bundle` — fence enforcement: no
#                      server-only paths or secret env names leak into
#                      .next/static/chunks/*.js)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit so the supabase-types alignment
          # check can diff against it. `fetch-depth: 0` is overkill but
          # cheaper than juggling the right shallow-fetch incantation
          # for both PR and push events.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Bundle audit (fence enforcement)
        run: bun run audit:bundle

      - name: Supabase types ↔ migrations alignment
        # Lightweight diff-pairing check — fails PRs that change a
        # migration without regenerating lib/shared/supabase/types.ts.
        # See scripts/verify-supabase-types.sh for the rationale.
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/verify-supabase-types.sh \
            origin/${{ github.event.pull_request.base.ref }}
