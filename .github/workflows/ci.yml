# CI — runs on every push to main and every PR.
#
# All gates hard-fail:
#   - typecheck       (`bunx tsc --noEmit`)
#   - lint            (`bun run lint`)
#   - build           (`bun run build`)
#   - bundle audit    (`bun run audit:bundle` — fence enforcement: no
#                      server-only paths or secret env names leak into
#                      .next/static/chunks/*.js)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit so the supabase-types alignment
          # check can diff against it. `fetch-depth: 0` is overkill but
          # cheaper than juggling the right shallow-fetch incantation
          # for both PR and push events.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Bundle audit (fence enforcement)
        run: bun run audit:bundle

      - name: Migration version prefixes are unique
        # The Supabase CLI keys schema_migrations by the numeric prefix;
        # two files with the same prefix break `supabase db reset`.
        run: bun run check:migrations

      - name: Supabase types ↔ migrations alignment
        # Lightweight diff-pairing check — fails PRs that change a
        # migration without regenerating lib/shared/supabase/types.ts.
        # See scripts/verify-supabase-types.sh for the rationale.
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/verify-supabase-types.sh \
            origin/${{ github.event.pull_request.base.ref }}

  # Python agent service (PLAN-agent-api.md). Phase 0 ships the FastAPI
  # scaffolding + auth middleware; this job gates that they stay
  # lint-clean, type-clean, and test-clean. Runs in parallel with the
  # main `ci` job since they share no inputs.
  agent-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-py

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest

  # agent-py against a real Postgres with every migration applied
  # (docs/PLAN-frontend-backend-split.md Q54): the run / task SQL, races
  # and RLS that the `agent-py` job can only skip. Also the one place CI
  # proves the migrations apply, in order, to an empty database.
  # Same script locally: `bun run test:db`.
  agent-py-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Sync dependencies
        working-directory: services/agent-py
        run: uv sync --frozen

      - name: Test against Postgres
        run: bash scripts/test-db.sh -rs

  # TS twin of the Python agent service (services/agent-ts/).
  # See docs/PLAN-agent-ts.md. Same gate shape as agent-py: a
  # typecheck + a test run. Runs in parallel with the main CI job
  # since they share no inputs.
  agent-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/agent-ts

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # agent-ts is frozen and self-contained (docs/PLAN-frontend-backend-split.md
      # Q11): the Next app modules it used are vendored under
      # `src/vendor/`, so no root `bun install` — only its own deps.
      # Guard: nothing under services/agent-ts may reach back into the
      # Next app's `lib/` (via the `@/server|shared|client` aliases or a
      # relative `../lib` path). Repo-root `config/` stays shared, read
      # as `@config/*`.
      - name: Guard against lib/ reach-back imports
        run: |
          if grep -rnE "['\"](@/(server|shared|client)(/|['\"])|(\.\./)+lib(/|['\"]))" src tests tsconfig.json; then
            echo "::error::services/agent-ts must not import the Next app's lib/ — use the vendored copies under src/vendor/"
            exit 1
          fi

      - name: Install agent-ts dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # Use `bun run test` (not `bun test`) so the package.json
        # script's `--conditions=react-server` flag applies — the
        # vendored `src/vendor/server/*` modules keep their
        # `import "server-only"` marker, which only resolves to a no-op
        # under that condition.
        run: bun run test

  # Drift gate for the TS types generated from the agent service's
  # OpenAPI doc. Regenerates against the live FastAPI schema and fails
  # if the checked-in `lib/shared/agent-py-types.generated.ts` is out
  # of date.
  agent-py-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: agent-py
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Sync agent-py deps
        working-directory: services/agent-py
        run: uv sync --frozen

      - name: Check generated types are up to date
        run: bun run codegen:agent-types:check

  # Spec-first contract (packages/contract, PLAN-frontend-backend-split
  # Q19): lint openapi.yaml, fail if the TS types / Pydantic models
  # generated from it are stale, and run the contract's offline tests
  # (spec compiles, fixtures valid, vendored AG-UI schema unchanged). The
  # conformance cases need a live backend, so they report as skipped here.
  # The suite's own typecheck + lint ride on the `ci` job (root tsc/eslint
  # cover packages/).
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Sync agent-py deps
        working-directory: services/agent-py
        run: uv sync --frozen

      - name: Lint openapi.yaml (Redocly)
        run: bun run contract:lint

      - name: Generated code is up to date with the spec
        run: bash packages/contract/scripts/gen.sh --check

      - name: Contract offline tests
        run: bun test ./packages/contract

  # Root web-app unit tests. Runs the split root suite via
  # `bun run test` → scripts/run-tests.sh (two bun processes: isolates
  # app/api/tasks/'s process-global mock.module mocks, excludes services/;
  # a coverage guard fails if a *.test.ts sits outside the configured
  # roots — see scripts/run-tests.sh / PR #218). Separate parallel job,
  # mirroring agent-py/agent-ts, so the `ci` build job's time is unchanged
  # and a test failure gets its own check name.
  app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  # Playwright smoke of chat on agent-py's /v1/runs (e2e/, decision Q39 of
  # docs/PLAN-frontend-backend-split.md). `bun run test:e2e` starts both
  # halves itself (playwright.config.ts): agent-py on the model-free stub
  # harness, anonymous runs, no Supabase; Next as a production build into
  # `.next-e2e/`. Chromium (headless shell) only; browsers cached by the
  # pinned @playwright/test version, their system libs installed each run.
  # Not a required check yet — to make it one, add `e2e` to the branch
  # protection rule's required status checks for main.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Sync agent-py deps
        working-directory: services/agent-py
        run: uv sync --frozen

      - name: Playwright version
        id: playwright
        run: echo "version=$(jq -r '.devDependencies["@playwright/test"]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Install Chromium system deps (cached browser)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: E2E (Playwright)
        run: bun run test:e2e

      # The runs task UI against its real provider, over a fake /v1/runs and
      # a fake Supabase on one origin (e2e/tasks-wire.config.ts; its own build
      # in .next-e2e-wire/).
      - name: E2E — tasks on runs (Playwright)
        run: bun run test:e2e:wire

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/e2e/
            test-results/e2e-wire/
          retention-days: 7
