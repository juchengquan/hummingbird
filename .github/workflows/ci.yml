# CI — runs on every push to main and every PR.
#
# All gates hard-fail:
#   - typecheck       (`bunx tsc --noEmit`)
#   - lint            (`bun run lint`)
#   - build           (`bun run build`)
#   - bundle audit    (`bun run audit:bundle` — fence enforcement: no
#                      server-only paths or secret env names leak into
#                      .next/static/chunks/*.js)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR base commit so the supabase-types alignment
          # check can diff against it. `fetch-depth: 0` is overkill but
          # cheaper than juggling the right shallow-fetch incantation
          # for both PR and push events.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Bundle audit (fence enforcement)
        run: bun run audit:bundle

      - name: Supabase types ↔ migrations alignment
        # Lightweight diff-pairing check — fails PRs that change a
        # migration without regenerating lib/shared/supabase/types.ts.
        # See scripts/verify-supabase-types.sh for the rationale.
        if: github.event_name == 'pull_request'
        run: |
          bash scripts/verify-supabase-types.sh \
            origin/${{ github.event.pull_request.base.ref }}

  # Python agent service (PLAN-agent-api.md). Phase 0 ships the FastAPI
  # scaffolding + auth middleware; this job gates that they stay
  # lint-clean, type-clean, and test-clean. Runs in parallel with the
  # main `ci` job since they share no inputs.
  agent-py:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent-py

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest

  # Drift gate for the TS types generated from the agent service's
  # OpenAPI doc. Regenerates against the live FastAPI schema and fails
  # if the checked-in `lib/shared/agent-py-types.generated.ts` is out
  # of date.
  agent-py-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: agent-py
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.4"
          enable-cache: true

      - name: Install bun deps
        run: bun install --frozen-lockfile

      - name: Sync agent-py deps
        working-directory: services/agent-py
        run: uv sync --frozen

      - name: Check generated types are up to date
        run: bun run codegen:agent-types:check
