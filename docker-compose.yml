# Local dev composition — spins up the agent service alongside Next.js.
#
# The Next.js dev server runs OUTSIDE compose (with `bun dev`) because Bun's
# hot reload is faster than a container restart, and developers usually want
# it on the host. Compose just runs the Python agent service so you don't
# need a local Python install.
#
# Usage:
#   docker compose up agent-py            # service only
#   docker compose up --build agent-py    # rebuild image then run
#   bun dev                               # in another terminal, runs Next.js
#
# Phase 0 ship: just the agent service. Phase 1+ may add the Supabase local
# stack here too (Supabase CLI already supports compose); for now the
# agent talks to whatever Supabase project the top-level `.env` points at.

services:
  agent-py:
    build:
      context: ./services/agent-py
      dockerfile: Dockerfile
    image: hummingbird/agent-py:dev
    ports:
      - "8000:8000"
    env_file:
      # Reuses the same .env the Next.js side reads. SUPABASE_JWT_SECRET is
      # the only required value; the rest are silently ignored.
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
