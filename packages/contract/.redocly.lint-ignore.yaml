# Deliberate exceptions to redocly.yaml's rules. Each entry needs a reason.
openapi.yaml:
  # Public liveness/readiness probes take no input and have no 4xx outcome.
  operation-4xx-response:
    - "#/paths/~1healthz/get/responses"
    - "#/paths/~1readyz/get/responses"
  # The `value` payloads of Hummingbird's CUSTOM run events. They travel
  # inside SSE frames (as AG-UI `CustomEvent.value`), which OpenAPI cannot
  # reference from an operation, but they are part of the contract and
  # are generated into the TS / Python types the stream consumers use.
  # Normative description: RUN_EVENTS.md.
  no-unused-components:
    - "#/components/schemas/RunGapEventValue"
    - "#/components/schemas/RunRewindEventValue"
