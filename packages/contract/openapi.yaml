openapi: 3.1.0
info:
  title: Hummingbird backend contract
  version: 0.1.0
  summary: The frontend <-> backend HTTP contract (spec-first, PLAN-frontend-backend-split.md Q19).
  description: |
    Hand-written source of truth for the HTTP surface every Hummingbird
    backend implements. TypeScript types and Pydantic models are generated
    from this file (`bun run contract:gen`); the conformance suite in
    `conformance/` validates a running backend against it.

    Versioning (Q22): paths carry a major version (`/v1`). Within a version
    changes are additive only; clients ignore unknown fields and event
    types. A breaking change ships as `/v2` alongside `/v1`. The
    `info.version` above versions this document, not the wire. Objects are
    deliberately left open (no `additionalProperties: false`) so that a
    field added later does not break an older receiver.

    Agent runs (Phase 2) will be described with the pinned AG-UI 1.0 JSON
    Schema in `agui/1.0/schema.json`, referenced by `$ref` — see README.md.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: Same origin — the reverse proxy routes `/v1/*` to the backend (Q21).

tags:
  - name: meta
    description: Liveness and readiness probes. Public.
  - name: storage
    description: Re-signing Supabase Storage URLs for generated artefacts.
  - name: artifacts
    description: Structured artefacts derived from model output.
  - name: embeddings
    description: Chunking and embedding file text into the vector index.
  - name: memory
    description: Cross-conversation memory upkeep.
  - name: security
    description: Browser security telemetry (CSP violation reports). Public.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [meta]
      summary: Liveness probe
      description: |
        200 as long as the process is up. Depends on no external service: a
        failing `/healthz` means restart the process.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReadyz
      tags: [meta]
      summary: Readiness probe
      description: |
        Reports which dependencies are configured and alive. A failing
        `/readyz` means do not route traffic yet; the process may recover on
        its own. `status` is `degraded` when a background component the
        backend started has died (the HTTP API still works).
      security: []
      responses:
        "200":
          description: Readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /v1/images/refresh-url:
    post:
      operationId: refreshImageUrl
      tags: [storage]
      summary: Re-sign an expired generated-image URL
      description: |
        Generated images live in Supabase Storage under `<user_id>/...`. The
        backend rejects a `storage_path` whose first segment is not the
        caller's user id (403) before touching Storage, and returns 404 when
        the object is missing or Storage is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshStorageUrlRequest"
      responses:
        "200":
          description: A freshly signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStorageUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/refresh-url:
    post:
      operationId: refreshFileUrl
      tags: [storage]
      summary: Re-sign an expired generated-file URL
      description: |
        Same contract as `/v1/images/refresh-url`, for files the model
        generated (bucket layout `<user_id>/...`). Mirrors the Next.js route
        `app/api/files/refresh-url/route.ts` exactly, including its body
        field `storagePath` (camelCase — unlike `/v1/images/refresh-url`,
        whose older wire uses `storage_path`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshFileUrlRequest"
      responses:
        "200":
          description: A freshly signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStorageUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/extract-table:
    post:
      operationId: extractTable
      tags: [artifacts]
      summary: Extract a citation table from a research report
      description: |
        Synchronous JSON (not streamed): given a research report and its
        sources, a model extracts a `CitationTable` artefact whose cells cite
        quotes from the numbered sources (`s1`, `s2`, ... in request order).
        Mirrors `app/api/extract-table/route.ts`. Spends model budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTableRequest"
      responses:
        "200":
          description: The extracted table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationTable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/embed:
    post:
      operationId: embedFile
      tags: [embeddings]
      summary: Chunk and embed a file's text into the vector index
      description: |
        Splits `text` into overlapping paragraph-aware chunks (the exact
        algorithm of `lib/server/embeddings/chunk.ts`), embeds them with the
        backend's configured OpenAI-compatible embedder and writes them to
        `file_sections` as the caller (RLS). Mirrors `app/api/embed/route.ts`.

        The expected "nothing to do" outcomes are 200 `skipped` answers, not
        errors: no embedder configured (`not_configured`), blank text
        (`empty`), the file already has sections and `force` is not set
        (`already_indexed`, `sections` = the existing count), and the `files`
        row is not visible to the caller yet (`file_not_found` — the client
        retries with backoff while its metadata sync catches up). `force`
        drops the file's sections and rebuilds them. Spends embedder budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Indexed, or skipped with a reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: The embedder or the database write failed (`code` is `embed_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/memory/extract:
    post:
      operationId: extractMemory
      tags: [memory]
      summary: Extract durable facts from a finished chat turn
      description: |
        Best-effort, post-turn memory upkeep. Mirrors
        `app/api/memory/extract/route.ts`: when the caller has
        `profiles.memory_enabled`, a model distils durable facts from
        `turnText` and merges them into the caller's `user_memories` (as the
        caller, RLS). A `tainted` turn — one that read third-party content —
        is never extracted from. Every well-formed, authenticated request
        answers `{ ok: true }`, whether or not anything was extracted (memory
        off, tainted turn, model unavailable or failing, write failure).
        Spends model budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryExtractRequest"
      responses:
        "200":
          description: Accepted (extraction is best-effort).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryExtractResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/csp-report:
    post:
      operationId: reportCspViolation
      tags: [security]
      summary: Receive Content-Security-Policy violation reports
      description: |
        Where browsers send CSP violation reports (`report-uri` and
        `Reporting-Endpoints` / `report-to` in the frontend's policy, when a
        backend is configured). Mirrors `app/api/csp-report/route.ts`.
        Public — browsers send no credentials. Reports are attacker-
        controllable, so the backend logs only an allow-list of fields
        (truncated, URLs cut to origin + path, share tokens redacted), caps
        the body, rate-limits per client IP and never echoes input: every
        answer except the transport-level 413 has an empty body.

        Accepted media types: `application/csp-report` (legacy `report-uri`:
        `{ "csp-report": { ... } }`), `application/reports+json` (Reporting
        API: `[{ "type": "csp-violation", "body": { ... } }, ...]`) and
        `application/json` (either shape). Any well-formed JSON is accepted;
        shapes that are not CSP reports are ignored.
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              $ref: "#/components/schemas/CspReportBody"
          application/reports+json:
            schema:
              $ref: "#/components/schemas/CspReportBody"
          application/json:
            schema:
              $ref: "#/components/schemas/CspReportBody"
      responses:
        "204":
          description: Received (and logged when it held CSP violations).
        "400":
          description: The body is not valid JSON. Empty body.
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: Unsupported `Content-Type`. Empty body.
        "429":
          description: Too many reports from this client IP. Empty body.
          headers:
            Retry-After:
              description: Seconds until the client may report again.
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Supabase user access token (`Authorization: Bearer <jwt>`). The
        backend requires `role = authenticated`, a UUID `sub`, the configured
        audience and an unexpired `exp`; the anon key is rejected.

  responses:
    BadRequest:
      description: The request body failed validation (`code` is `invalid_request`), or named an unknown model (`unknown_model`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed or rejected bearer token (`code` is `auth` or `auth_required`).
      headers:
        WWW-Authenticate:
          description: "`Bearer` when the token was missing or rejected."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is authenticated but does not own the resource (`code` is `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist, or the backing store is not configured (`code` is `not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the backend's per-route cap.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: |
        Transitional: FastAPI's own request validation (agent-py) answers 422
        with `{ detail: [...] }`. Backends should prefer 400 `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: The caller or the upstream model provider is rate limited (`code` is `rate_limit`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: The model provider failed or returned unusable output (`code` is `provider`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: |
        The backend is misconfigured for this operation — e.g. its JWT secret
        is unset, so it cannot verify any token (`code` is `unavailable`).
        Distinct from 401 so monitoring can alert on it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiError:
      type: object
      description: |
        The error envelope every backend returns on a non-2xx JSON response:
        a stable machine-readable `code` plus a human-readable `message`. The
        client keys typed UI off `code`; `message` is for display only.

        `code` is an open set (new codes are additive). In use today:
        `invalid_request`, `auth`, `auth_required`, `forbidden`, `not_found`,
        `unavailable`, `rate_limit`, `context_window`, `invalid_model`,
        `unknown_model`, `provider`, `aborted`, `unknown`. See
        `lib/shared/api-errors.ts`.
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          examples: [auth, invalid_request, not_found]
        message:
          type: string
      additionalProperties: true

    LegacyFastApiError:
      type: object
      description: |
        Transitional. agent-py currently returns FastAPI's default envelope —
        `{ detail: <string | ApiError | validation issues> }` — instead of a
        flat `ApiError`. Accepted so the suite describes today's backend;
        removed once agent-py flattens its errors (run the conformance suite
        with `CONTRACT_STRICT_ERRORS=1` to reject it).
      required: [detail]
      properties:
        detail:
          anyOf:
            - type: string
            - $ref: "#/components/schemas/ApiError"
            - type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"

    ValidationIssue:
      type: object
      description: One FastAPI/Pydantic request-validation issue.
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            type: [string, integer]
        msg:
          type: string
        type:
          type: string
      additionalProperties: true

    ErrorResponse:
      description: An `ApiError`, or (transitionally) the legacy FastAPI envelope.
      anyOf:
        - $ref: "#/components/schemas/ApiError"
        - $ref: "#/components/schemas/LegacyFastApiError"

    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: The implementation's name, e.g. `agent-py`.
        version:
          type: string
          description: The implementation's own version.

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"

    ReadinessChecks:
      type: object
      description: |
        Implementation-specific dependency checks. The keys below are the
        ones agent-py reports; every key is optional and another backend may
        report others.
      properties:
        supabase_url_configured:
          type: boolean
        supabase_db_configured:
          type: boolean
        jwt_secret_configured:
          type: boolean
        db_pool_open:
          type: boolean
        poller_alive:
          type: [boolean, "null"]
          description: Null when no background poll loop was started; false when it was started and has died.
        poller_last_tick_age_seconds:
          type: [number, "null"]
          description: Seconds since the poll loop last finished a tick; null before the first.
      additionalProperties:
        type: [boolean, number, string, "null"]

    RefreshStorageUrlRequest:
      type: object
      required: [storage_path]
      properties:
        storage_path:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Object path inside the bucket, `<user_id>/...`. Must not start
            with `/` or contain `..`; its first segment must be the caller's
            user id.
          examples: ["8a6e0804-2bd0-4672-b79d-d97027f9071a/images/abc.png"]

    RefreshFileUrlRequest:
      type: object
      required: [storagePath]
      properties:
        storagePath:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Object path inside the bucket, `<user_id>/...`. Must not start
            with `/` or contain `..`; its first segment must be the caller's
            user id.
          examples: ["8a6e0804-2bd0-4672-b79d-d97027f9071a/generated/report.pdf"]

    RefreshStorageUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          description: A newly signed, long-lived URL for the object.

    ExtractTableRequest:
      type: object
      required: [reportText, sources]
      properties:
        reportText:
          type: string
          minLength: 1
          maxLength: 100000
        sources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExtractTableSource"
        model:
          type: string
          maxLength: 100
          description: Model id from the backend's allow-list. Absent means the backend's default extraction model.
        columnHints:
          type: array
          maxItems: 8
          description: |
            Optional column hints. Each entry is a plain label (legacy, treated
            as `text`) or `{ label, type? }`. When present the model uses these
            labels verbatim.
          items:
            $ref: "#/components/schemas/ColumnHint"

    ExtractTableSource:
      type: object
      required: [title, url, snippet]
      properties:
        title:
          type: string
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        snippet:
          type: string
          maxLength: 2000

    ColumnHint:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 60
        - $ref: "#/components/schemas/TypedColumnHint"

    TypedColumnHint:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: "#/components/schemas/ColumnType"

    ColumnType:
      type: string
      enum: [text, number, link, date]
      description: How a citation-table column's values are formatted and sorted.

    CitationTable:
      type: object
      description: A table artefact whose cells cite quotes from `sources`. See `lib/shared/artifacts/citation-table.ts`.
      required: [columns, rows, sources]
      properties:
        columns:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CitationTableColumn"
        rows:
          type: array
          maxItems: 200
          description: One row is a map of column id to cell. A column with no entry renders as an empty cell.
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CitationTableCell"
        sources:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CitationTableSource"

    CitationTableColumn:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 60
        label:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/ColumnType"

    CitationTableCell:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 4000
        citations:
          type: array
          maxItems: 8
          default: []
          description: Quote-cited support for the value. May be empty.
          items:
            $ref: "#/components/schemas/Citation"

    Citation:
      type: object
      required: [sourceId, quote]
      properties:
        sourceId:
          type: string
          minLength: 1
        quote:
          type: string
          maxLength: 2000

    CitationTableSource:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        snippet:
          type: string
          maxLength: 1000

    EmbedRequest:
      type: object
      required: [fileId, text]
      properties:
        fileId:
          type: string
          minLength: 1
          maxLength: 64
          description: Id of the caller's `files` row the sections belong to.
        text:
          type: string
          maxLength: 1200000
          description: The file's extracted full text.
        force:
          type: boolean
          description: Drop the file's existing sections and rebuild them.

    EmbedResponse:
      type: object
      required: [status, sections]
      properties:
        status:
          type: string
          enum: [indexed, skipped]
        sections:
          type: integer
          minimum: 0
          description: Chunks written (`indexed`) or already present (`already_indexed`); otherwise 0.
        reason:
          type: string
          enum: [not_configured, empty, already_indexed, file_not_found]
          description: Why the request was skipped. Absent when `indexed`.

    MemoryExtractRequest:
      type: object
      required: [turnText]
      properties:
        turnText:
          type: string
          minLength: 1
          maxLength: 50000
          description: "The finished turn, as `User: ...` / `Assistant: ...` paragraphs."
        conversationId:
          type: string
          maxLength: 64
          description: Provenance stamped on new facts (`source_conversation_id`).
        tainted:
          type: boolean
          description: The turn read third-party content; nothing is extracted.

    MemoryExtractResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    CspReportBody:
      description: |
        A legacy `report-uri` object (`{ "csp-report": { ... } }`) or a
        Reporting-API batch (an array of `{ type, body }` reports; only
        `type: csp-violation` entries are read, at most 20 per batch). Left
        open: any JSON value is accepted and unknown shapes are ignored.
      examples:
        - csp-report:
            document-uri: https://app.example.com/dashboard
            effective-directive: script-src-elem
            blocked-uri: https://cdn.example.com/x.js
            disposition: report
