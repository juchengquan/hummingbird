openapi: 3.1.0
info:
  title: Hummingbird backend contract
  version: 0.5.2
  summary: The frontend <-> backend HTTP contract (spec-first, PLAN-frontend-backend-split.md Q19).
  description: |
    Hand-written source of truth for the HTTP surface every Hummingbird
    backend implements. TypeScript types and Pydantic models are generated
    from this file (`bun run contract:gen`); the conformance suite in
    `conformance/` validates a running backend against it.

    Versioning (Q22): paths carry a major version (`/v1`). Within a version
    changes are additive only; clients ignore unknown fields and event
    types. A breaking change ships as `/v2` alongside `/v1`. The
    `info.version` above versions this document, not the wire. Objects are
    deliberately left open (no `additionalProperties: false`) so that a
    field added later does not break an older receiver.

    Agent runs (tag `runs`) are described with the pinned AG-UI 1.0 JSON
    Schema in `agui/1.0/schema.json`, referenced by `$ref`; how the
    backend's internal events map onto AG-UI is `RUN_EVENTS.md`.

    `x-planned` on an operation marks it specified but not implemented yet
    (its value names the wave that implements it). The conformance suite
    skips planned operations; implementing one means deleting its marker.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /
    description: Same origin — the reverse proxy routes `/v1/*` to the backend (Q21).

tags:
  - name: meta
    description: Liveness and readiness probes. Public.
  - name: storage
    description: Re-signing Supabase Storage URLs for generated artefacts.
  - name: artifacts
    description: Structured artefacts derived from model output.
  - name: sharing
    description: Read-only public share links for a conversation or a document.
  - name: schedules
    description: Recurring background-task runs (`task_schedules`) — a saved task spec plus a cron expression and IANA timezone.
  - name: embeddings
    description: Chunking and embedding file text into the vector index.
  - name: memory
    description: Cross-conversation memory upkeep.
  - name: security
    description: Browser security telemetry (CSP violation reports). Public.
  - name: runs
    description: |
      Agent runs (Phase 2, Q7): start, rejoin, status, cancel, list. Events
      are AG-UI 1.0 (`agui/1.0/schema.json`); the internal-event mapping is
      `RUN_EVENTS.md`.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [meta]
      summary: Liveness probe
      description: |
        200 as long as the process is up. Depends on no external service: a
        failing `/healthz` means restart the process.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      operationId: getReadyz
      tags: [meta]
      summary: Readiness probe
      description: |
        Reports which dependencies are configured and alive. A failing
        `/readyz` means do not route traffic yet; the process may recover on
        its own. `status` is `degraded` when a background component the
        backend started has died (the HTTP API still works).
      security: []
      responses:
        "200":
          description: Readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /v1/images/refresh-url:
    post:
      operationId: refreshImageUrl
      tags: [storage]
      summary: Re-sign an expired generated-image URL
      description: |
        Generated images live in Supabase Storage under `<user_id>/...`. The
        backend rejects a `storage_path` whose first segment is not the
        caller's user id (403) before touching Storage, and returns 404 when
        the object is missing or Storage is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshStorageUrlRequest"
      responses:
        "200":
          description: A freshly signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStorageUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/files/refresh-url:
    post:
      operationId: refreshFileUrl
      tags: [storage]
      summary: Re-sign an expired generated-file URL
      description: |
        Same contract as `/v1/images/refresh-url`, for files the model
        generated (bucket layout `<user_id>/...`). Mirrors the Next.js route
        `app/api/files/refresh-url/route.ts` exactly, including its body
        field `storagePath` (camelCase — unlike `/v1/images/refresh-url`,
        whose older wire uses `storage_path`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshFileUrlRequest"
      responses:
        "200":
          description: A freshly signed URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshStorageUrlResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/extract-table:
    post:
      operationId: extractTable
      tags: [artifacts]
      summary: Extract a citation table from a research report
      description: |
        Synchronous JSON (not streamed): given a research report and its
        sources, a model extracts a `CitationTable` artefact whose cells cite
        quotes from the numbered sources (`s1`, `s2`, ... in request order).
        Mirrors `app/api/extract-table/route.ts`. Spends model budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTableRequest"
      responses:
        "200":
          description: The extracted table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationTable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # --- sharing ---------------------------------------------------------------
  /v1/share:
    post:
      operationId: createShare
      tags: [sharing]
      summary: Create a share link
      description: |
        Mints an opaque share token (128 random bits, base64url without
        padding — 22 characters) for one of the caller's conversations or
        documents. The target must be the caller's own (checked under the
        caller's row-level security): someone else's id, or one that does
        not exist, answers 404. Mirrors `app/api/share/route.ts`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "200":
          description: The new share.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/share/{token}:
    parameters:
      - $ref: "#/components/parameters/ShareToken"
    get:
      operationId: getShare
      tags: [sharing]
      summary: Read a shared conversation or document (public)
      description: |
        **Public — no bearer token.** The token is the capability: anyone
        holding it can read what it points at. Returns only what the
        read-only share pages render — never user ids or other rows. An
        unknown or revoked token, a share whose target is missing or not
        owned by the share's creator, and a backend without a database all
        answer the same 404, so a response reveals nothing beyond "this
        token resolves". Rate limited per client IP. Mirrors
        `lib/server/share/resolve.ts` (`resolveShare`).
      security: []
      responses:
        "200":
          description: The shared content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedShare"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: revokeShare
      tags: [sharing]
      summary: Revoke a share link
      description: |
        Stamps `revoked_at` on the caller's share. Scoped by the caller's
        row-level security, so a token that does not exist and one that
        belongs to another user both answer 404 without revealing which.
        Revoking an already-revoked share succeeds again. Mirrors
        `app/api/share/[token]/route.ts`.
      responses:
        "200":
          description: The share is revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeShareResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # --- end sharing -----------------------------------------------------------

  # --- schedules ------------------------------------------------------------
  /v1/tasks/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List the caller's schedules
      description: |
        Every schedule the caller owns, newest first (`created_at` desc).
        Read as the caller under row-level security. Mirrors
        `GET /api/tasks/schedules`.
      responses:
        "200":
          description: The caller's schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      description: |
        Validates the cron + timezone (parseable; at most 12 fires an hour
        in the minute field; never two fires within 5 minutes over the next
        48) and stores the row with its first `nextRunAt`. Written as the
        caller, so the database also enforces workspace ownership (403) and
        the 20-enabled-schedules cap (409 `limit_reached`). `timezone`
        defaults to `UTC`, `enabled` to true. Mirrors
        `POST /api/tasks/schedules`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleCreateRequest"
      responses:
        "201":
          description: The created schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/tasks/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The schedule's id (a UUID).
        schema:
          type: string
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Update a schedule
      description: |
        Partial update: absent fields are left alone, `null` clears a
        nullable field. A changed `cron` or `timezone` is re-validated and
        recomputes `nextRunAt`; otherwise `nextRunAt` is kept, so an edit
        never pulls the next fire earlier. Re-enabling past the per-user cap
        is 409 `limit_reached`. Mirrors `PATCH /api/tasks/schedules/:id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleUpdateRequest"
      responses:
        "200":
          description: The updated schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule
      description: |
        Deletes the caller's schedule. Idempotent: an id the caller does not
        own (or that does not exist) is also `{ ok: true }`. Mirrors
        `DELETE /api/tasks/schedules/:id`.
      responses:
        "200":
          description: Deleted (or already gone).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/embed:
    post:
      operationId: embedFile
      tags: [embeddings]
      summary: Chunk and embed a file's text into the vector index
      description: |
        Splits `text` into overlapping paragraph-aware chunks (the exact
        algorithm of `lib/server/embeddings/chunk.ts`), embeds them with the
        backend's configured OpenAI-compatible embedder and writes them to
        `file_sections` as the caller (RLS). Mirrors `app/api/embed/route.ts`.

        The expected "nothing to do" outcomes are 200 `skipped` answers, not
        errors: no embedder configured (`not_configured`), blank text
        (`empty`), the file already has sections and `force` is not set
        (`already_indexed`, `sections` = the existing count), and the `files`
        row is not visible to the caller yet (`file_not_found` — the client
        retries with backoff while its metadata sync catches up). `force`
        drops the file's sections and rebuilds them. Spends embedder budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Indexed, or skipped with a reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: The embedder or the database write failed (`code` is `embed_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/memory/extract:
    post:
      operationId: extractMemory
      tags: [memory]
      summary: Extract durable facts from a finished chat turn
      description: |
        Best-effort, post-turn memory upkeep. Mirrors
        `app/api/memory/extract/route.ts`: when the caller has
        `profiles.memory_enabled`, a model distils durable facts from
        `turnText` and merges them into the caller's `user_memories` (as the
        caller, RLS). A `tainted` turn — one that read third-party content —
        is never extracted from. Every well-formed, authenticated request
        answers `{ ok: true }`, whether or not anything was extracted (memory
        off, tainted turn, model unavailable or failing, write failure).
        Spends model budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryExtractRequest"
      responses:
        "200":
          description: Accepted (extraction is best-effort).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryExtractResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/csp-report:
    post:
      operationId: reportCspViolation
      tags: [security]
      summary: Receive Content-Security-Policy violation reports
      description: |
        Where browsers send CSP violation reports (`report-uri` and
        `Reporting-Endpoints` / `report-to` in the frontend's policy, when a
        backend is configured). Mirrors `app/api/csp-report/route.ts`.
        Public — browsers send no credentials. Reports are attacker-
        controllable, so the backend logs only an allow-list of fields
        (truncated, URLs cut to origin + path, share tokens redacted), caps
        the body, rate-limits per client IP and never echoes input: every
        answer except the transport-level 413 has an empty body.

        Accepted media types: `application/csp-report` (legacy `report-uri`:
        `{ "csp-report": { ... } }`), `application/reports+json` (Reporting
        API: `[{ "type": "csp-violation", "body": { ... } }, ...]`) and
        `application/json` (either shape). Any well-formed JSON is accepted;
        shapes that are not CSP reports are ignored.
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              $ref: "#/components/schemas/CspReportBody"
          application/reports+json:
            schema:
              $ref: "#/components/schemas/CspReportBody"
          application/json:
            schema:
              $ref: "#/components/schemas/CspReportBody"
      responses:
        "204":
          description: Received (and logged when it held CSP violations).
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          description: Unsupported `Content-Type` (`code` is `unsupported_content_type`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reports from this client IP (`code` is `rate_limit`).
          headers:
            Retry-After:
              description: Seconds until the client may report again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # --- runs -------------------------------------------------------------------
  /v1/runs:
    post:
      operationId: startRun
      tags: [runs]
      summary: Start a run — interactive (streamed) or background (queued)
      description: |
        Starts one agent run on a thread (Q7, Q24, Q27). The body is an AG-UI
        1.0 `RunAgentInput`; Hummingbird's own run options ride in
        `forwardedProps` (`RunForwardedProps`), `mode` among them, because
        `RunAgentInput` is a closed schema and cannot carry a top-level
        `mode` (see `StartRunRequest`). The event model and every event's
        wire mapping are in `RUN_EVENTS.md`.

        **Modes.** `interactive` (the default) runs in the process that
        received the request and answers `200 text/event-stream`: the
        run's AG-UI events, exactly as `streamRunEvents` would send them
        from cursor `0` (Q28). `background` queues the run for a worker and
        answers `202 RunAccepted`; follow it with `streamRunEvents` or
        `getRun`. Background runs require a signed-in caller and a thread
        that is one of the caller's synced conversations (`404 not_found`
        otherwise). An interactive run needs neither: its thread may exist
        only in the browser (local-first, Q2/Q15).

        **Client-minted ids.** `runId` and `threadId` are UUIDs the client
        generates (AG-UI: the client mints `runId`). A repeated `runId` is
        an **idempotent retry**, never a second run, when it comes from the
        run's owner (the same user; for an anonymous run, the same
        `X-Run-Token`) with the same `threadId` and `mode`: an interactive
        retry answers 200 and streams the run from cursor `0` (replay, then
        live), a background retry answers 202 with the run's current
        status. Nothing in the retried body is re-validated or applied —
        the first request's input wins. Any other request carrying a
        `runId` that already exists — another user's run, an anonymous
        run without its token, or the caller's own run on another thread
        or in another mode — answers `409 run_id_conflict`, always with
        the same body, which says nothing about the existing run. (A
        client-chosen id in a global id space cannot be made fully
        unobservable: refusing it reveals that it is taken. UUIDv4 ids
        make that worthless — an id is only known to whoever was given
        it — and the refusal discloses nothing else.)

        **Resume (Q24).** Answering an interrupted run is a new run on the
        same thread whose `resume[]` answers every open interrupt of that
        run (one `ResumeEntry` per interrupt id; `payload` per
        `RUN_EVENTS.md` § Interrupts). `forwardedProps.previousRunId`
        names the interrupted run; it must be the caller's, on the same
        thread, in the same `mode` (absent is `interactive`), not a
        sub-agent run, `interrupted`, and `resume[]` must cover exactly
        its open interrupts — otherwise `409 invalid_state`, also when
        that stops being true before the run is created (a cancel).
        A `resume[]` without `previousRunId` is `400 invalid_request`. An
        interrupted run has at most one live resume: while another run
        answering it is running, interrupted or succeeded, a new one is
        `409 run_already_resumed` (an idempotent retry of that resume,
        same `runId`, still replays it). A resume that failed or was
        cancelled frees the interrupts only if it never applied the
        answers (Q57, Q63): once it has, a tool may have run. An
        interactive one then answers `409 run_answer_applied` — the
        interrupted run stays `interrupted` (Q64), and the turn is sent
        again as a new message; a background one answers the same `409
        run_answer_applied` (0.5.0; `run_already_resumed` before) — the
        task has failed, and "run again" is a new task. A resume that
        ended before applying frees them: answer again with a new `runId`. A
        background resume (Q41) starts from the paused run's saved state
        plus the answers (`RUN_EVENTS.md` § 4.2); a question being
        answered through the old task respond route is `409
        run_already_answered` (per question, Q58). A background run whose
        `start` job can't be queued (`409 limit_reached`) is not created.

        **At most 5 active tasks (Q72, Q79).** A new background run (no
        `previousRunId`) is refused with `409 limit_reached`, before
        anything is created, while 5 of the caller's tasks are active —
        a task (`Run.rootRunId`) counts while its current run is
        `queued`, `running` (a parent waiting on its sub-agent runs
        included) or `interrupted`. Answers (a resume) are never refused
        by it, and an idempotent retry of a run that was created still
        answers 202. The same cap holds for the old task route and for
        schedules: a schedule that fires at the cap creates its run
        already `failed` with `error.code` `limit_reached`.

        **Background runs take no `attachments`** (Q49): a background
        start with any is `400 invalid_request`, before anything is
        created.

        A model a background run can't run is refused the same way (Q55):
        `auto`, anything outside the allow-list, and on a resume the
        paused run's saved one.

        A `forwardedProps.model` outside the backend's allow-list is `400
        unknown_model`, answered before the run exists (as `/v1/chat`):
        no row, no stream, nothing to rejoin. So is a user message part
        the backend cannot give the model (`400 invalid_attachment`, the
        `message` naming the part and the limit — see `StartRunRequest`):
        an attachment is refused, never silently dropped.

        **Anonymous callers** (no `Authorization` header) may start
        interactive runs only — `mode: background` answers `401
        auth_required`, as does every anonymous run when the backend
        requires sign-in for AI (today's `REQUIRE_AUTH_FOR_AI`, Q20). The
        200 response then carries `X-Run-Token`, the run's capability: the
        only credential `getRun`, `streamRunEvents` and `cancelRun` accept
        for that run, and what makes a retry of it idempotent (send it
        with the retry). An anonymous resume sends the interrupted run's
        token the same way, as proof that the run is the caller's; the
        answering run keeps that token. Any other new anonymous run gets a
        fresh one. Anonymous
        runs are not persisted: their event log lives in backend memory
        for about 15 minutes after the run ends (Q16), after which every
        operation on them answers 404. Anonymous runs are rate- and
        budget-limited per client IP (`429 rate_limit`).

        A present but invalid credential (a malformed or rejected bearer
        token, a non-Bearer scheme) is always `401`, never treated as
        anonymous. Spends model budget.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "200":
          description: |
            Interactive run: the run's event stream. Each SSE message is
            `id: <cursor>` (absent on `RUN_STARTED`, a `gap` and the
            closing event) and `data: <one AG-UI event as JSON>`. Cursor
            format and replay rules: see `streamRunEvents`.
          headers:
            Location:
              description: "`/v1/runs/{runId}` of the run."
              schema:
                type: string
            X-Run-Token:
              description: Anonymous runs only — the run's capability token (see `runToken`).
              schema:
                $ref: "#/components/schemas/RunToken"
          content:
            text/event-stream:
              schema:
                $ref: "./agui/1.0/schema.json#/$defs/Event"
        "202":
          description: Background run accepted (new, or an idempotent retry of an existing one).
          headers:
            Location:
              description: "`/v1/runs/{runId}` of the run."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Background run whose thread is not one of the caller's conversations (`code` is `not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `run_id_conflict` — the `runId` is taken and this request is
            not an idempotent retry of it (identical body in every case);
            `invalid_state` — a resume that does not match the previous
            run (not the caller's, another thread, another mode, a
            sub-agent run, not `interrupted`, or `resume[]` not covering
            exactly its open interrupts);
            `run_already_resumed` — another run already answers the
            previous run's interrupts and has not failed or been
            cancelled, so an approved tool never runs twice;
            `run_answer_applied` — a run that answered the previous
            run's interrupts applied the answers (an approved tool may
            have run) and then failed or was cancelled (Q57, Q63): they
            can't be answered again. Interactive: send the turn again as
            a new message. Background (0.5.0): the task has failed — its
            current run (`Run.currentRunId`) says how;
            `run_already_answered` — the question of a background run is
            being answered through the old task respond route (each
            question is answered once, Q58);
            `limit_reached` — a new background run while 5 of the
            caller's tasks are active (Q72, Q79), or one whose `start`
            job could not be queued (20 queued jobs per user); either way
            it was not created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listRuns
      tags: [runs]
      summary: List the caller's runs
      description: |
        The signed-in caller's runs, newest first (`createdAt` desc, then
        `id` desc), filtered by every parameter given. Token paging in the
        A2A style: pass `nextPageToken` back as `pageToken` with the same
        filters; a page is stable under concurrent inserts (keyset
        paging), and an unknown, malformed or filter-mismatched token is
        `400 invalid_request`. Anonymous runs are never listed.

        **Tasks (0.5.0, Q69).** A task is a background run with no parent
        (its root), every run that answered it (`previousRunId`) and
        every sub-agent run any of them spawned; all of them share its
        `rootRunId`. The tasks panel lists one row per task with
        `mode=background&topLevel=true&current=true` — each task's
        current run, which carries the task's status, question and
        progress — and reads a task's history with `rootRunId`. A boolean
        filter that is absent does not filter; `false` selects the
        opposite set.
      parameters:
        - name: threadId
          in: query
          description: Only runs on this thread (conversation).
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only runs in one of these statuses (repeat the parameter for several).
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RunStatus"
        - name: parentRunId
          in: query
          description: Only sub-agent runs spawned by this run.
          schema:
            type: string
            format: uuid
        - name: mode
          in: query
          description: Only runs in this mode.
          schema:
            $ref: "#/components/schemas/RunMode"
        - name: topLevel
          in: query
          description: |
            `true`: only runs that no run spawned (`parentRunId` null) —
            a task's root and its answers, and interactive runs. `false`:
            only sub-agent runs. Absent: both.
          schema:
            type: boolean
        - name: current
          in: query
          description: |
            `true`: only runs that are their task's current run
            (`currentRunId` null — see `Run.currentRunId`): one per task,
            and every sub-agent run (answered in place, Q59). `false`:
            only runs a later run of their task took over (an answered
            `interrupted` run) and resumes that failed or were cancelled
            before applying their answers (dead branches, Q75). Absent:
            both.
          schema:
            type: boolean
        - name: rootRunId
          in: query
          description: |
            Only the runs of this task: its root, every run that answered
            it, and their sub-agent runs (`Run.rootRunId`).
          schema:
            type: string
            format: uuid
        - name: delivered
          in: query
          description: |
            `true`: only runs whose task's result was marked delivered
            (`markRunDelivered`, `Run.delivered`). `false`: only runs
            whose task's result was not — with `current=true` and
            `status=succeeded`, the finished results still to write into
            their conversations (Q70). Absent: both.
          schema:
            type: boolean
        - name: pageSize
          in: query
          description: Page size; absent means 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: pageToken
          in: query
          description: The previous page's `nextPageToken`.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      tags: [runs]
      summary: Read a run's status
      description: |
        The run resource. Authorised by the owner's bearer token, or by
        the run's `X-Run-Token` for an anonymous run. A run that does not
        exist, belongs to someone else, or whose token does not match all
        answer the same `404 not_found`.
      security:
        - bearerAuth: []
        - runToken: []
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: streamRunEvents
      tags: [runs]
      summary: Rejoin a run's event stream (replay from a cursor, then live)
      description: |
        Replays the run's event log after a cursor and then follows it
        live until the run ends (finished, failed, cancelled or
        interrupted), then closes. Works for live and finished runs; no
        published protocol defines replay from an offset, so this is ours
        (see `RUN_EVENTS.md` § Streams for the normative rules).

        **Framing.** Every stream — this one and `startRun`'s — opens with
        exactly one `RUN_STARTED` (no SSE `id`), then the replayed and live
        events, and ends with the closing `RUN_FINISHED` (success,
        interrupt or cancelled outcome) or `RUN_ERROR`. A client
        reconnecting after it already saw a run's `RUN_STARTED` ignores
        the repeat.

        **Cursor.** Every event encoded from a log entry carries an SSE
        `id:` — the replay cursor, `<seq>` or `<seq>.<k>` — where `seq`
        numbers the internal log entry and `k` (0-based) orders the
        AG-UI events one entry produced: an entry's last event has id
        `<seq>`, any before it `<seq>.0`, `<seq>.1`, …. Ids increase
        strictly within a stream. `RUN_STARTED`, a `gap` (and a purged
        run's empty snapshot) and the closing event belong to no entry
        and carry no id. Resuming at the last id received (`after` or
        `Last-Event-ID`) neither repeats nor skips an entry's event.
        Clients may treat the id as opaque; the integer part is the log
        `seq` (`Run.lastSeq` is the highest).

        **Gap.** When the cursor points into the part of the log that
        compaction folded away (Q17/Q30), or the run's log has been
        purged, the stream sends a `CUSTOM` event named `hummingbird.gap`
        (`RunGapEventValue`, no `id`) and immediately after it a
        `MESSAGES_SNAPSHOT` (id `<resumeAt>`) whose messages are **this
        run's output only** — not the whole thread — then continues after
        `resumeAt`. A client replaces what it holds of this run's output
        with the snapshot.
      security:
        - bearerAuth: []
        - runToken: []
      parameters:
        - name: after
          in: query
          description: |
            Replay strictly after this cursor (an SSE `id` this run's
            stream sent, `<seq>` or `<seq>.<k>`). Wins over
            `Last-Event-ID`. Absent (and no `Last-Event-ID`) means `0`:
            the whole run.
          schema:
            $ref: "#/components/schemas/RunCursor"
        - name: Last-Event-ID
          in: header
          description: The standard SSE reconnection header; same meaning as `after`.
          schema:
            $ref: "#/components/schemas/RunCursor"
      responses:
        "200":
          description: The run's event stream (`text/event-stream`, one AG-UI event per SSE message).
          content:
            text/event-stream:
              schema:
                $ref: "./agui/1.0/schema.json#/$defs/Event"
        "400":
          description: The cursor is malformed or beyond the run's log (`code` is `invalid_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Cancel a run
      description: |
        Idempotent. A background run stands for its task (Q60): cancelling
        any run of its chain of answers cancels every run before and after
        it and their sub-agent runs, and the questions don't reopen — also
        when the run named has itself ended. Cancelling a sub-agent run
        cancels it alone: its parent continues without it. An interactive
        run is cancelled alone.

        A `queued`, `running` or `interrupted` run becomes
        `cancelled` (an interrupted run's open interrupts are abandoned),
        and its stream closes with `RUN_FINISHED { outcome: { type:
        "cancelled" } }`; a run that already ended is left as it is. Either
        way the answer is the run as it now stands. Cancelling stops the
        harness at its next cancellation check — events already produced
        stay in the log. Authorised like `getRun`, with the same `404`.
      security:
        - bearerAuth: []
        - runToken: []
      responses:
        "200":
          description: The run after the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/runs/{runId}/answers:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: answerRun
      tags: [runs]
      summary: Answer a sub-agent run's question in place
      description: |
        Answers the open interrupt of an `interrupted` **sub-agent** run
        (`parentRunId` set) in place: the same run continues, no new run
        is started. A named exception to Q24, for sub-agent runs only
        (Q59): their parent waits on that very run, so it can't be
        answered by a new one (`RUN_EVENTS.md` § 4.4). Any other run is
        answered with `startRun` and `previousRunId`.

        `resume` holds one `ResumeEntry` per open interrupt of the run
        (a background run has one at a time), `payload` shaped as
        `RUN_EVENTS.md` § 4.2 says for the interrupt's `reason` — an
        approval needs a boolean `approved`. `status: cancelled`
        declines.

        Answered once: the answer is queued for a worker and the call
        returns `202` with the run as it now stands — still
        `interrupted`, `answerPending: true` — until the worker picks it
        up and the run is `running` again. Its stream (`streamRunEvents`)
        closed at the interrupt: follow the run again from its last
        cursor. Each question is answered once, whichever route answers
        it (Q58).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRunRequest"
      responses:
        "202":
          description: The answer is queued; the run as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: |
            `invalid_request` — `resume` does not answer exactly the
            run's open interrupts, or a `payload` doesn't fit its
            interrupt (an approval without a boolean `approved`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `invalid_state` — not a sub-agent run (answer a top-level run
            with `startRun` and `previousRunId`), or the run is not
            waiting on that question any more (it was cancelled, or it
            ended);
            `run_already_answered` — an answer to that question was
            already accepted (by this operation or the old task respond
            route) and is queued or being applied;
            `limit_reached` — the answer could not be queued (20 queued
            jobs per user); nothing was answered, try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/runs/{runId}/delivered:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: markRunDelivered
      tags: [runs]
      summary: Mark a finished task's result delivered
      description: |
        Records that the task whose **root** run this is has had its
        result written into its conversation (Q70, Q77): a browser wrote
        the result message — and the research document and artifact —
        under ids derived from the task, waited for sync to push them,
        then calls this. Every run of the task then reads `delivered:
        true`, and `listRuns?delivered=false` no longer lists it, so no
        other browser delivers it again.

        Idempotent: marking a task delivered twice answers `200` both
        times and keeps the first mark. Only once the task has ended —
        its current run `succeeded`, `failed` or `cancelled` (a failed or
        cancelled task writes no message; marking it says the browser has
        shown that). Background runs only, so signed-in callers only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The root run, `delivered` true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `invalid_state` — the run is not a task's root (a resume, a
            sub-agent run or an interactive run: use its `rootRunId`), or
            the task has not ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  # --- end runs ----------------------------------------------------------------

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Supabase user access token (`Authorization: Bearer <jwt>`). The
        backend requires `role = authenticated`, a UUID `sub`, the configured
        audience and an unexpired `exp`; the anon key is rejected.
    runToken:
      type: apiKey
      in: header
      name: X-Run-Token
      description: |
        An anonymous run's capability token (Q20), issued by `startRun` in
        the `X-Run-Token` response header. Accepted only by the operations
        on that one run (`getRun`, `streamRunEvents`, `cancelRun`). Never
        put it in a URL.

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      description: The run's id — the client-minted AG-UI `runId` (a UUID).
      schema:
        type: string
        format: uuid
    ShareToken:
      name: token
      in: path
      required: true
      description: The opaque share token returned by `createShare`.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        examples: ["q3Jx0dQe2yQb7m3YqH1v8w"]

  responses:
    Conflict:
      description: |
        The request conflicts with the resource's state or a per-user limit
        (`code` is `limit_reached` or `invalid_state`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The backend failed to complete the operation (`code` is `unknown`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: The request body failed validation (`code` is `invalid_request`), named an unknown model (`unknown_model`), or (`startRun`) carried an attachment the backend cannot give the model (`invalid_attachment`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, malformed or rejected bearer token (`code` is `auth` or `auth_required`).
      headers:
        WWW-Authenticate:
          description: "`Bearer` when the token was missing or rejected."
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller is authenticated but does not own the resource (`code` is `forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The resource does not exist, or the backing store is not configured (`code` is `not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request body exceeds the backend's per-route cap (`code` is `payload_too_large`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: |
        The request body failed the backend's schema validation (`code` is
        `invalid_request`, with the individual problems in `issues`).
        agent-py answers these with 422; a 400 `invalid_request` means the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    RateLimited:
      description: The caller or the upstream model provider is rate limited (`code` is `rate_limit`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: The model provider failed or returned unusable output (`code` is `provider`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: |
        The backend is misconfigured for this operation — e.g. its JWT secret
        is unset, so it cannot verify any token (`code` is `unavailable`).
        Distinct from 401 so monitoring can alert on it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ApiError:
      type: object
      description: |
        The error envelope every backend returns on a non-2xx JSON response:
        a stable machine-readable `code` plus a human-readable `message`. The
        client keys typed UI off `code`; `message` is for display only.

        `code` is an open set (new codes are additive). In use today:
        `invalid_request`, `auth`, `auth_required`, `forbidden`, `not_found`,
        `unavailable`, `rate_limit`, `context_window`, `invalid_model`,
        `unknown_model`, `provider`, `aborted`, `unknown`. See
        `lib/shared/api-errors.ts`. The runs operations add
        `run_id_conflict`, `run_already_resumed`, `run_already_answered`,
        `run_answer_applied` and `invalid_attachment`, and use
        `invalid_state`.
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          examples: [auth, invalid_request, not_found]
        message:
          type: string
      additionalProperties: true

    ValidationIssue:
      type: object
      description: One request-validation issue — where (`loc`), what (`msg`), and its machine `type`.
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            type: [string, integer]
        msg:
          type: string
        type:
          type: string
      additionalProperties: true

    ErrorResponse:
      description: |
        The body of every non-2xx JSON response: an `ApiError`. (The
        transitional FastAPI `{ detail }` envelope is no longer accepted.)
      allOf:
        - $ref: "#/components/schemas/ApiError"

    ValidationErrorResponse:
      description: An `ApiError` (`code` is `invalid_request`) carrying the validation issues found.
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            issues:
              type: array
              items:
                $ref: "#/components/schemas/ValidationIssue"

    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: The implementation's name, e.g. `agent-py`.
        version:
          type: string
          description: The implementation's own version.

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          $ref: "#/components/schemas/ReadinessChecks"

    ReadinessChecks:
      type: object
      description: |
        Implementation-specific dependency checks. The keys below are the
        ones agent-py reports; every key is optional and another backend may
        report others.
      properties:
        supabase_url_configured:
          type: boolean
        supabase_db_configured:
          type: boolean
        jwt_secret_configured:
          type: boolean
        db_pool_open:
          type: boolean
        poller_alive:
          type: [boolean, "null"]
          description: Null when no background poll loop was started; false when it was started and has died.
        poller_last_tick_age_seconds:
          type: [number, "null"]
          description: Seconds since the poll loop last finished a tick; null before the first.
        scheduler_alive:
          type: [boolean, "null"]
          description: Null when the schedule dispatcher loop is not enabled; false when it was started and has died.
        scheduler_last_tick_age_seconds:
          type: [number, "null"]
          description: Seconds since the schedule dispatcher last finished a tick; null before the first.
      additionalProperties:
        type: [boolean, number, string, "null"]

    RefreshStorageUrlRequest:
      type: object
      required: [storage_path]
      properties:
        storage_path:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Object path inside the bucket, `<user_id>/...`. Must not start
            with `/` or contain `..`; its first segment must be the caller's
            user id.
          examples: ["8a6e0804-2bd0-4672-b79d-d97027f9071a/images/abc.png"]

    RefreshFileUrlRequest:
      type: object
      required: [storagePath]
      properties:
        storagePath:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Object path inside the bucket, `<user_id>/...`. Must not start
            with `/` or contain `..`; its first segment must be the caller's
            user id.
          examples: ["8a6e0804-2bd0-4672-b79d-d97027f9071a/generated/report.pdf"]

    RefreshStorageUrlResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          description: A newly signed, long-lived URL for the object.

    ExtractTableRequest:
      type: object
      required: [reportText, sources]
      properties:
        reportText:
          type: string
          minLength: 1
          maxLength: 100000
        sources:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ExtractTableSource"
        model:
          type: string
          maxLength: 100
          description: Model id from the backend's allow-list. Absent means the backend's default extraction model.
        columnHints:
          type: array
          maxItems: 8
          description: |
            Optional column hints. Each entry is a plain label (legacy, treated
            as `text`) or `{ label, type? }`. When present the model uses these
            labels verbatim.
          items:
            $ref: "#/components/schemas/ColumnHint"

    ExtractTableSource:
      type: object
      required: [title, url, snippet]
      properties:
        title:
          type: string
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        snippet:
          type: string
          maxLength: 2000

    ColumnHint:
      anyOf:
        - type: string
          minLength: 1
          maxLength: 60
        - $ref: "#/components/schemas/TypedColumnHint"

    TypedColumnHint:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        type:
          $ref: "#/components/schemas/ColumnType"

    ColumnType:
      type: string
      enum: [text, number, link, date]
      description: How a citation-table column's values are formatted and sorted.

    CitationTable:
      type: object
      description: A table artefact whose cells cite quotes from `sources`. See `lib/shared/artifacts/citation-table.ts`.
      required: [columns, rows, sources]
      properties:
        columns:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/CitationTableColumn"
        rows:
          type: array
          maxItems: 200
          description: One row is a map of column id to cell. A column with no entry renders as an empty cell.
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CitationTableCell"
        sources:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/CitationTableSource"

    CitationTableColumn:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 60
        label:
          type: string
          minLength: 1
          maxLength: 120
        type:
          $ref: "#/components/schemas/ColumnType"

    CitationTableCell:
      type: object
      required: [value]
      properties:
        value:
          type: string
          maxLength: 4000
        citations:
          type: array
          maxItems: 8
          default: []
          description: Quote-cited support for the value. May be empty.
          items:
            $ref: "#/components/schemas/Citation"

    Citation:
      type: object
      required: [sourceId, quote]
      properties:
        sourceId:
          type: string
          minLength: 1
        quote:
          type: string
          maxLength: 2000

    CitationTableSource:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 300
        url:
          type: string
          maxLength: 2000
        snippet:
          type: string
          maxLength: 1000

    # --- sharing -------------------------------------------------------------
    ShareKind:
      type: string
      enum: [conversation, document]
      description: What a share points at.

    CreateShareRequest:
      description: |
        A conversation share names `conversationId`; a document share names
        `documentId` (a workspace owns several documents, so the target is
        one document, not the workspace).
      oneOf:
        - $ref: "#/components/schemas/CreateConversationShareRequest"
        - $ref: "#/components/schemas/CreateDocumentShareRequest"
      discriminator:
        propertyName: kind
        mapping:
          conversation: "#/components/schemas/CreateConversationShareRequest"
          document: "#/components/schemas/CreateDocumentShareRequest"

    CreateConversationShareRequest:
      type: object
      required: [kind, conversationId]
      properties:
        kind:
          type: string
          enum: [conversation]
        conversationId:
          type: string
          format: uuid

    CreateDocumentShareRequest:
      type: object
      required: [kind, documentId]
      properties:
        kind:
          type: string
          enum: [document]
        documentId:
          type: string
          format: uuid

    CreateShareResponse:
      type: object
      required: [token, kind]
      properties:
        token:
          type: string
          minLength: 1
          description: The share token. The share page URL is `/share/<kind>/<token>`.
        kind:
          $ref: "#/components/schemas/ShareKind"

    RevokeShareResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    ResolvedShare:
      description: What a share page renders, by `kind`.
      oneOf:
        - $ref: "#/components/schemas/ResolvedConversationShare"
        - $ref: "#/components/schemas/ResolvedDocumentShare"
      discriminator:
        propertyName: kind
        mapping:
          conversation: "#/components/schemas/ResolvedConversationShare"
          document: "#/components/schemas/ResolvedDocumentShare"

    ResolvedConversationShare:
      type: object
      required: [kind, conversationTitle, messages, createdAt]
      properties:
        kind:
          type: string
          enum: [conversation]
        conversationTitle:
          type: string
        messages:
          type: array
          description: The conversation's messages in `position` order.
          items:
            $ref: "#/components/schemas/SharedMessage"
        createdAt:
          type: string
          format: date-time
          description: When the share was created.

    ResolvedDocumentShare:
      type: object
      required: [kind, documentTitle, documentContent, createdAt]
      properties:
        kind:
          type: string
          enum: [document]
        documentTitle:
          type: string
          description: The document's title, or `Untitled` when it has none.
        documentContent:
          type: string
          description: The document body (markdown).
        createdAt:
          type: string
          format: date-time
          description: When the share was created.

    SharedMessage:
      type: object
      required: [id, role, content, position]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        reasoning:
          type: [string, "null"]
          description: The model's reasoning text, when it was kept.
        position:
          type: integer
    # --- end sharing ---------------------------------------------------------

    # --- schedules ----------------------------------------------------------
    ScheduleCron:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^\S+\s+\S+\s+\S+\s+\S+\s+\S+$'
      description: |
        Five space-separated fields (minute hour day-of-month month
        day-of-week), evaluated with cron-parser semantics. The backend
        additionally rejects expressions that cannot be parsed or fire more
        often than every 5 minutes (400 `invalid_request`).
      examples: ["0 8 * * *", "*/15 9-17 * * 1-5"]

    ScheduleCreateRequest:
      type: object
      required: [workspaceId, name, prompt, cron]
      properties:
        workspaceId:
          type: string
          minLength: 1
          maxLength: 64
          description: The workspace (owned by the caller) the scheduled runs belong to.
        name:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        cron:
          $ref: "#/components/schemas/ScheduleCron"
        timezone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA timezone, e.g. `America/Los_Angeles`. Absent means `UTC`.
        enabled:
          type: boolean
          description: Absent means true.
        model:
          type: [string, "null"]
          maxLength: 100
          description: |
            Model id. Nothing picks one at run time: a schedule that fires
            without a model fails "no model" (Q56). So a schedule created
            without one — or re-enabled while it has none (the update's
            `enabled: true`) — is given the backend's default task model
            (Haiku, Q67) when it is saved, and the response shows it
            (Q73, Q80). Schedules that had none were paused by migration
            0047 until their owners re-enable them.
        systemPrompt:
          type: [string, "null"]
          maxLength: 20000
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SkillConfig"
        maxSteps:
          type: [integer, "null"]
          minimum: 1
          maximum: 50
          description: Step budget per run; null means 25.

    ScheduleUpdateRequest:
      type: object
      description: Any subset of the create fields. `null` is accepted only where the create body accepts it.
      properties:
        workspaceId:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        cron:
          $ref: "#/components/schemas/ScheduleCron"
        timezone:
          type: string
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean
        model:
          type: [string, "null"]
          maxLength: 100
        systemPrompt:
          type: [string, "null"]
          maxLength: 20000
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SkillConfig"
        maxSteps:
          type: [integer, "null"]
          minimum: 1
          maximum: 50

    ScheduleResponse:
      type: object
      required:
        - id
        - workspaceId
        - name
        - prompt
        - cron
        - timezone
        - enabled
        - model
        - systemPrompt
        - maxSteps
        - lastRunAt
        - lastRunTaskId
        - nextRunAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        prompt:
          type: string
        cron:
          type: string
        timezone:
          type: string
        enabled:
          type: boolean
        model:
          type: [string, "null"]
        systemPrompt:
          type: [string, "null"]
        skills:
          type: array
          description: Absent when the schedule has no skill list.
          items:
            $ref: "#/components/schemas/SkillConfig"
        maxSteps:
          type: [integer, "null"]
        lastRunAt:
          type: [string, "null"]
          format: date-time
        lastRunTaskId:
          type: [string, "null"]
          description: The task the last fire created, for deep-linking to its result.
        nextRunAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ScheduleListResponse:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleResponse"

    DeleteScheduleResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    SkillConfig:
      type: object
      description: A skill enabled for a run, with optional per-skill settings (`ChatRequestSchema.shape.skills` in `lib/shared/api-schemas.ts`).
      required: [id]
      properties:
        id:
          type: string
          maxLength: 40
        webSearchConfig:
          $ref: "#/components/schemas/WebSearchSkillConfig"
        webFetchConfig:
          $ref: "#/components/schemas/MaxCallsSkillConfig"
        imageGenConfig:
          $ref: "#/components/schemas/ImageGenSkillConfig"
        fileSearchConfig:
          $ref: "#/components/schemas/MaxCallsSkillConfig"

    MaxCallsSkillConfig:
      type: object
      properties:
        maxCalls:
          type: integer
          minimum: 1
          maximum: 50

    WebSearchSkillConfig:
      type: object
      properties:
        maxCalls:
          type: integer
          minimum: 1
          maximum: 50
        tavily:
          type: object
          properties:
            enabled:
              type: boolean
            searchDepth:
              type: string
              enum: [basic, advanced]
        brave:
          type: object
          properties:
            enabled:
              type: boolean
            freshness:
              type: string
              enum: [any, pd, pw, pm, py]
        exa:
          type: object
          properties:
            enabled:
              type: boolean
            type:
              type: string
              enum: [auto, neural, keyword]

    ImageGenSkillConfig:
      type: object
      properties:
        maxCalls:
          type: integer
          minimum: 1
          maximum: 50
        aspectRatio:
          type: string
          enum: ["1:1", "16:9", "9:16", "4:3", "3:4", "2:3", "3:2"]

    EmbedRequest:
      type: object
      required: [fileId, text]
      properties:
        fileId:
          type: string
          minLength: 1
          maxLength: 64
          description: Id of the caller's `files` row the sections belong to.
        text:
          type: string
          maxLength: 1200000
          description: The file's extracted full text.
        force:
          type: boolean
          description: Drop the file's existing sections and rebuild them.

    EmbedResponse:
      type: object
      required: [status, sections]
      properties:
        status:
          type: string
          enum: [indexed, skipped]
        sections:
          type: integer
          minimum: 0
          description: Chunks written (`indexed`) or already present (`already_indexed`); otherwise 0.
        reason:
          type: string
          enum: [not_configured, empty, already_indexed, file_not_found]
          description: Why the request was skipped. Absent when `indexed`.

    MemoryExtractRequest:
      type: object
      required: [turnText]
      properties:
        turnText:
          type: string
          minLength: 1
          maxLength: 50000
          description: "The finished turn, as `User: ...` / `Assistant: ...` paragraphs."
        conversationId:
          type: string
          maxLength: 64
          description: Provenance stamped on new facts (`source_conversation_id`).
        tainted:
          type: boolean
          description: The turn read third-party content; nothing is extracted.

    MemoryExtractResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    CspReportBody:
      description: |
        A legacy `report-uri` object (`{ "csp-report": { ... } }`) or a
        Reporting-API batch (an array of `{ type, body }` reports; only
        `type: csp-violation` entries are read, at most 20 per batch). Left
        open: any JSON value is accepted and unknown shapes are ignored.
      examples:
        - csp-report:
            document-uri: https://app.example.com/dashboard
            effective-directive: script-src-elem
            blocked-uri: https://cdn.example.com/x.js
            disposition: report

    # --- runs ------------------------------------------------------------------
    RunMode:
      type: string
      enum: [interactive, background]
      description: |
        `interactive`: runs in the API process that received `startRun`,
        streamed to the caller (Q28). `background`: queued for a worker;
        requires sign-in.

    RunStatus:
      type: string
      enum: [queued, running, interrupted, succeeded, failed, cancelled]
      description: |
        A run's lifecycle. `queued` (background, not picked up yet) →
        `running` → one of the four ends: `succeeded`, `failed`,
        `cancelled`, or `interrupted` (waiting for answers to its open
        interrupts — which a **new** run answers, Q24; an interrupted run
        runs again only when it is answered in place: a sub-agent run's
        question always is, through `answerRun` or the old task respond
        route, Q59). `queued` ends
        when a worker starts executing. A background run waiting on its own
        sub-agent runs is still `running`. Mapping to the internal status
        and `tasks.status`: `RUN_EVENTS.md` § Status.

    RunToken:
      type: string
      minLength: 22
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
      description: |
        An anonymous run's capability: at least 128 random bits,
        base64url without padding. Issued once, in `startRun`'s
        `X-Run-Token` response header; the backend stores only a hash.

    RunCursor:
      type: string
      pattern: "^(0|[1-9][0-9]{0,9})(\\.(0|[1-9][0-9]{0,3}))?$"
      description: |
        A replay cursor — an SSE `id` a run stream sent: `<seq>` (after
        log entry `seq` entirely) or `<seq>.<k>` (after the k-th AG-UI
        event entry `seq` produced). `0` is before the first entry.
      examples: ["0", "42", "42.1"]

    RunForwardedProps:
      type: object
      description: |
        Hummingbird's run options, carried in AG-UI's
        `RunAgentInput.forwardedProps` (application-specific values the
        protocol passes through). Open: a backend ignores keys it does not
        know, and new keys are additive. Every key is optional.
      properties:
        mode:
          $ref: "#/components/schemas/RunMode"
        previousRunId:
          type: string
          format: uuid
          description: |
            The interrupted run this one answers. Required with a
            non-empty `resume[]`, otherwise ignored.
        model:
          type: string
          maxLength: 100
          description: Model id from the backend's allow-list. Absent means the backend's default.
        systemPrompt:
          type: string
          maxLength: 20000
          description: Extra instructions (workspace / conversation system prompt), prepended to the backend's own.
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/SkillConfig"
        goal:
          type: string
          maxLength: 2000
          description: Background runs — the task's title. Absent means the last user message's text.
        maxSteps:
          type: integer
          minimum: 1
          maximum: 50
          description: Step budget. Absent means 25 (background; 35 with `research`) or the chat default (interactive).
        requireApprovalFor:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
          description: |
            Tool names that wait for the user's approval before they run
            (an `approval` interrupt, RUN_EVENTS.md § 4). Adds to what
            always waits (`askUser`, `renderUI`, MCP tools their server
            marks for approval).
        workspaceId:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The caller's workspace the run belongs to (signed-in runs):
            scopes `searchFiles` and adds the workspace's cloud MCP
            tools. Ignored for anonymous runs.
        reasoningEffort:
          type: string
          enum: [low, medium, high]
          description: |
            Reasoning-effort tier (the chat's `reasoningEffort`): the
            model thinks before answering with a budget per tier (agent-py:
            Anthropic extended thinking, 2048 / 8192 / 16384 budget
            tokens). Ignored for a model that takes no tier
            (`supportsReasoningEffort` in the catalog). Absent means the
            provider default (no extended thinking).
        research:
          type: boolean
          description: |
            Research mode (Q46): the run follows the research task
            prompt (plan → per-section search → gap pass → a cited
            Markdown report), and its citations are verified. Absent
            means false. Not called `mode`, which is interactive /
            background. A background research run's step budget
            defaults to 35. agent-py: background runs (interactive runs
            take only the citation checks, `verifyCitations`).
        allowedMcpServerIds:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: |
            MCP servers whose tools the run may offer (Q48), cloud
            (`workspaceId`) and local (`localMcpServers`) alike. Absent
            means no restriction; an empty list means no MCP tools. On a
            resume, interactive or background, it can only narrow the
            paused run's list (Q51); absent keeps that list.
        attachments:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/RunAttachment"
          description: |
            Sources attached to this turn — files, URL bookmarks, MCP
            resources — the way the Next chat route's `attachments`
            carries them, but large inputs by reference (Q44): a cloud
            file by id, never its text. Rendered into the system prompt
            under one character budget, files first, as the Next chat
            route renders them; a cloud file's header carries its id, and
            a RAG-mode file is a note to call `searchFiles` with it (Q47).
            Every attachment marks the turn as reading third-party content
            (`RunResult.memoryTainted`). Interactive runs only: a
            background run refuses them (Q49, `400 invalid_request`). One
            the run cannot give the model is `400 invalid_attachment`
            (see `RunFileAttachment`, `RunInlineFileAttachment`).
        memoryBypass:
          type: boolean
          description: |
            The conversation's memory opt-out (the chat body's
            `memoryBypass`, set from `Conversation.memoryOff`): no
            remembered facts in the prompt and no remember / forget
            tools. Absent means false.
        verifyCitations:
          type: boolean
          description: |
            Opt-in citation verification: when the turn produced cited
            claims over retrieved sources, a post-turn verifier pass
            emits a `hummingbird.verification` part (agent-py: when
            `VERIFY_MODEL` is set). Absent means false.
        referenceImage:
          $ref: "#/components/schemas/RunReferenceImage"
        localFilesOnly:
          type: boolean
          description: |
            The account's "store files locally" preference: generated
            images come back as data URLs instead of being uploaded to
            Storage. Absent means false.
        sandboxFiles:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RunSandboxFile"
          description: |
            The files `runCode` may mount at `/mnt/files/<name>` (0.5.2,
            Q92), when the `codeInterpreter` skill is on: the Next chat
            body's `sandboxFiles`, the model naming them by `name`. A cloud
            file goes by id — the backend reads it only if it is the
            caller's (Q44); `dataBase64` only for a signed-out user's local
            file, within the request size limit. A background run takes
            cloud files only (Q93): one with `dataBase64` is
            `400 invalid_request`. A file that can't be mounted is a note
            to the model, never an error.
        localMcpServers:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/LocalMcpServer"
          description: |
            Local-mode MCP servers (Q42, Q45): servers whose credentials
            live in the browser, with their cached tool list. Interactive
            runs only — a background run refuses them. **No
            credentials here**: they ride in `RunAgentInput.state` under
            `hummingbird.localMcp` (see `StartRunRequest`).
      additionalProperties: true

    RunSandboxFile:
      type: object
      description: A file `runCode` may mount (`RunForwardedProps.sandboxFiles`).
      required: [name, fileId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: The name the model passes to `runCode`'s `files`.
        fileId:
          type: string
          minLength: 1
          maxLength: 64
        dataBase64:
          type: string
          maxLength: 13333336
          description: The bytes, base64 — a signed-out user's local file only.
      additionalProperties: false

    RunAttachment:
      description: |
        One source attached to a turn (`RunForwardedProps.attachments`),
        by `kind`. Mirrors the Next chat body's `AttachmentPayloadSchema`
        (`lib/shared/api-schemas.ts`), except that a signed-in user's file
        goes by id (Q44).
      oneOf:
        - $ref: "#/components/schemas/RunFileAttachment"
        - $ref: "#/components/schemas/RunInlineFileAttachment"
        - $ref: "#/components/schemas/RunBookmarkAttachment"
        - $ref: "#/components/schemas/RunMcpResourceAttachment"
      discriminator:
        propertyName: kind
        mapping:
          file: "#/components/schemas/RunFileAttachment"
          inlineFile: "#/components/schemas/RunInlineFileAttachment"
          bookmark: "#/components/schemas/RunBookmarkAttachment"
          mcpResource: "#/components/schemas/RunMcpResourceAttachment"

    RunFileAttachment:
      type: object
      description: |
        A cloud file (a synced `files` row), by id. The backend reads its
        extracted text (and an image's stored data URL) itself, after
        checking the caller owns it (its Storage / database access bypasses
        RLS); a row it cannot read as the caller's renders as the name
        only. Signed-in runs only: on an anonymous run, or a backend with
        no database, it is `400 invalid_attachment`.
      required: [kind, fileId, name]
      properties:
        kind:
          type: string
          enum: [file]
        fileId:
          type: string
          minLength: 1
          maxLength: 64
          description: The file's id (`UploadedFile.id`, the `files` row id).
        name:
          type: string
          minLength: 1
          maxLength: 500
          description: The file name, as the user sees it.
        mimeType:
          type: string
          maxLength: 100
        sizeBytes:
          type: integer
          minimum: 0
        extractedKind:
          type: string
          maxLength: 40
          description: What extraction made of it (`UploadedFile.extractedKind`, e.g. `pdf`).
        retrievalMode:
          type: string
          enum: [inline, rag]
          description: |
            `inline` (default): the text goes into the prompt, within
            the attachments budget. `rag`: only a note that the file can
            be searched with `searchFiles` (by its id, Q47).

    RunInlineFileAttachment:
      type: object
      description: |
        A file that exists only in the browser (a signed-out user's, or
        one not synced), sent by value: its extracted `text`, or — for a
        small file with none — its bytes as a `data:` URL. One of the
        two is expected. A `dataUrl` follows the media rules of
        `StartRunRequest` (an image, a PDF or a text file within their
        limits), else `400 invalid_attachment`.
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [inlineFile]
        name:
          type: string
          minLength: 1
          maxLength: 500
        mimeType:
          type: string
          maxLength: 100
        sizeBytes:
          type: integer
          minimum: 0
        extractedKind:
          type: string
          maxLength: 40
        text:
          type: string
          maxLength: 120000
          description: The extracted text (the Next body's `FileSummary.text` cap).
        truncated:
          type: boolean
          description: The text was cut before sending.
        dataUrl:
          type: string
          maxLength: 1500000
          pattern: "^data:"
          description: The file's bytes, base64 in a `data:` URL (about 1 MiB at most).

    RunBookmarkAttachment:
      type: object
      description: |
        A URL bookmark with the text fetched for it, capped. Third-party
        content: it taints the turn for memory extraction.
      required: [kind, url, title, text]
      properties:
        kind:
          type: string
          enum: [bookmark]
        id:
          type: string
          maxLength: 64
          description: The bookmark's id, if the client has one.
        url:
          type: string
          minLength: 1
          maxLength: 2000
        title:
          type: string
          minLength: 1
          maxLength: 500
        text:
          type: string
          maxLength: 220000
          description: The fetched page text (the Next body's `ATTACHMENT_TEXT_MAX`).
        truncated:
          type: boolean
        fetchedAt:
          type: string
          maxLength: 64
          description: When the text was fetched (ISO 8601).

    RunMcpResourceAttachment:
      type: object
      description: |
        A resource of an MCP server, by reference: the backend reads it
        (`resources/read`) from the server named by `serverId` — a cloud
        server of the workspace, or one of `localMcpServers` with its
        credential from `state`.
      required: [kind, serverId, uri, name]
      properties:
        kind:
          type: string
          enum: [mcpResource]
        id:
          type: string
          maxLength: 64
          description: The cached resource row's id, if the client has one.
        serverId:
          type: string
          minLength: 1
          maxLength: 64
        uri:
          type: string
          minLength: 1
          maxLength: 2000
        name:
          type: string
          minLength: 1
          maxLength: 500
        mimeType:
          type: string
          maxLength: 100

    RunReferenceImage:
      type: object
      description: |
        The reference image for image-to-image generation (the chat
        body's `referenceImage`, set by an image's Remix action): the
        model is told to call `generateImage` with `referenceImageUrl`
        when the user asks for a variation. Only with the `imageGen`
        skill.
      required: [url]
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 4000

    LocalMcpServer:
      type: object
      description: |
        A local-mode MCP server (credentials held by the browser) and its
        cached capabilities — the Next chat body's `mcpServers[]` entry
        without `credentials`.
      required: [id, name, url]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          minLength: 1
          maxLength: 2000
          description: The server's MCP endpoint (HTTP transport).
        transport:
          type: string
          enum: [http]
        requiresApproval:
          type: boolean
          description: Every tool of this server waits for the user's approval.
        capabilities:
          type: object
          properties:
            tools:
              type: array
              maxItems: 64
              items:
                $ref: "#/components/schemas/LocalMcpTool"

    LocalMcpTool:
      type: object
      description: One tool from a local MCP server's cached tool list; offered as `mcp__<serverId>__<name>`.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        inputSchema:
          description: The tool's JSON Schema, forwarded to the model as is.
        uiResourceUri:
          type: string
          maxLength: 2000
          description: The `ui://` resource an MCP App tool renders.

    LocalMcpCredential:
      type: object
      description: |
        One local MCP server's credential, as the browser stores it — the
        Next chat body's `mcpServers[].credentials`. Travels only in
        `RunAgentInput.state["hummingbird.localMcp"]` (`LocalMcpCredentials`).
      properties:
        type:
          type: string
          maxLength: 40
        headers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: string
            maxLength: 8192
          description: HTTP headers sent to the server (e.g. `Authorization`).

    LocalMcpCredentials:
      type: object
      description: |
        The value of `RunAgentInput.state["hummingbird.localMcp"]`: server
        id (a `localMcpServers[].id`) → its credential (Q45). The backend
        never stores or logs it — not in the run row, its checkpoint, the
        event log or an error — and never echoes it; a resume re-sends it.
      maxProperties: 8
      additionalProperties:
        $ref: "#/components/schemas/LocalMcpCredential"

    StartRunRequest:
      description: |
        An AG-UI 1.0 `RunAgentInput`, by reference into the pinned schema,
        narrowed: `threadId` and `runId` are UUIDs, and `forwardedProps`,
        when present, is a `RunForwardedProps`. (`mode` cannot be a
        top-level field: `RunAgentInput` is closed —
        `unevaluatedProperties: false` — so any extra key fails it.)

        `messages` is the thread's history up to and including the new
        user message (Q15 — the browser owns the history; the backend
        keeps nothing across runs). Messages with role `activity` are
        display state and are not sent to the model. `tools` are
        client-side tools; the backend's own tools come from
        `forwardedProps.skills`.

        **Attachments.** A user message's `content` may list `image` and
        `document` parts (AG-UI `ContentPart`) next to its `text`:

        | part | source | limit |
        |---|---|---|
        | `image` | `data` with `mimeType` `image/jpeg`, `image/png`, `image/gif` or `image/webp` | 5 MiB of base64 each |
        | `image` | `url` (`https://`) | — |
        | `document` | `data` with a `text/*` `mimeType` — the file's extracted text, UTF-8 | 1 MiB of text each |
        | `document` | `data` with `application/pdf` | 10 MiB of base64 each |
        | `document` | `url` (`https://`, a PDF) | — |

        At most 20 images and 40 documents per run, over all messages. A
        document's `metadata.name` is its title for the model, and
        `metadata.truncated: true` tells the model the text was cut.
        Anything else — `audio` / `video` parts, `file` (provider handle)
        sources, other media types, malformed base64, a part over its
        limit, more parts than allowed — is `400 invalid_attachment`.

        **`state`.** Hummingbird reads one key of AG-UI's `state`:
        `hummingbird.localMcp`, the credentials of the local MCP servers
        listed in `forwardedProps.localMcpServers` (`LocalMcpCredentials`:
        server id → `{type?, headers?}`, Q45). Credentials never go in
        `forwardedProps` (stored with a background run) or a header
        (reverse-proxy access logs record headers). The backend holds them
        only in memory for the run: never in the run row, its checkpoint,
        the event log, a log line or an error, and never echoed in a
        stream. So a resume — a new run — must send them again, and a
        background run never gets them. Other `state` keys are ignored.
      allOf:
        - $ref: "./agui/1.0/schema.json#/$defs/RunAgentInput"
        - type: object
          properties:
            threadId:
              $ref: "#/components/schemas/UuidString"
            runId:
              $ref: "#/components/schemas/UuidString"
            forwardedProps:
              $ref: "#/components/schemas/RunForwardedProps"

    UuidString:
      type: string
      pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      description: |
        A UUID in its canonical text form. A pattern rather than
        `format: uuid` where it narrows an AG-UI string field, so the
        generated models keep the AG-UI field's `str` type.
      examples: ["8a6e0804-2bd0-4672-b79d-d97027f9071a"]

    RunAccepted:
      type: object
      required: [runId, status]
      properties:
        runId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RunStatus"

    RunResult:
      type: object
      description: |
        A succeeded run's return value — also `RUN_FINISHED.result` on the
        wire. Open; keys are additive.
      properties:
        text:
          type: string
          description: |
            The run's final assistant text, when it produced one. For a
            background task's run, the whole answer across its runs (the
            root and each resume that answered it, Q78), not this run's
            text alone.
        memoryTainted:
          type: boolean
          description: |
            The run read third-party content (web, file, MCP or sandbox
            tools), so post-turn memory extraction must skip it. Absent
            means false.
        stoppedAt:
          type: string
          enum: [max_steps]
          description: |
            Why the answer may be incomplete. `max_steps`: a background
            task stopped at its step limit and delivers what it has (Q81);
            `text` then ends with a visible "stopped at the step limit"
            note. Absent for a run that finished on its own.
        verification:
          type: object
          additionalProperties: true
          description: |
            A research run's citation check over `text` (Q78): the same
            object as its `hummingbird.verification` activity's content
            (`{ checks, summary }`). Absent when no check ran.
        images:
          type: array
          description: |
            The images the answer carries (0.5.1, Q87): every image the
            task's runs generated (`generateImage`, `runCode` charts), in
            order, then its sub-agents' results' images — so a parent's
            answer carries what its sub-agents drew. Each is the
            `hummingbird.tool_image` image shape: a Storage URL with its
            `storagePath`, or a data URL when files are kept local.
            An empty list when there are none; absent only on a result
            written before 0.5.1 (a client then reads them from the
            run's `hummingbird.tool_image` activities). `listRuns` rows
            leave `images` out (a data-URL image can be megabytes and
            the list is polled): read them from `getRun`.
          items:
            type: object
            required: [url]
            additionalProperties: true
            properties:
              id:
                type: string
              url:
                type: string
              storagePath:
                type: string
              width:
                type: integer
              height:
                type: integer
              format:
                type: string
              prompt:
                type: string
              mode:
                type: string
        files:
          type: array
          description: |
            The files the answer carries (0.5.2, Q94): every
            `hummingbird.tool_file` file of the task's runs (`runCode`'s
            `/tmp/outputs`), in order, then its sub-agents' results' files.
            Each a Storage URL with its `storagePath`, or a data URL when
            files are kept local. Like `images`: an empty list when there
            are none, absent on a result written before 0.5.2, and left
            out of `listRuns` rows.
          items:
            type: object
            required: [url]
            additionalProperties: true
            properties:
              id:
                type: string
              name:
                type: string
              sizeBytes:
                type: integer
              mimeType:
                type: string
              url:
                type: string
              storagePath:
                type: string
        codeResults:
          type: array
          description: |
            The code output the answer carries (0.5.2, Q94): every
            `hummingbird.code_result` of the task's runs, in order, then
            its sub-agents' results'. Charts are in `images` (mode `code`).
            Like `images`: an empty list when there are none, absent on a
            result written before 0.5.2, and left out of `listRuns` rows.
          items:
            type: object
            required: [id]
            additionalProperties: true
            properties:
              id:
                type: string
                description: The `runCode` tool call id.
              stdout:
                type: string
              stderr:
                type: string
              results:
                type: array
                items:
                  type: object
                  additionalProperties: true
      additionalProperties: true

    RunError:
      type: object
      description: Why a run failed — also `RUN_ERROR`'s `code` / `message`.
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
          description: "An `ApiError` code: `rate_limit`, `auth`, `context_window`, `provider`, `upstream`, `max_steps`, `no_worker`, `worker_lost`, `unknown`, …"
        message:
          type: string

    Run:
      type: object
      description: |
        The run resource (modelled on the LangChain Agent Protocol's run).
        Exactly one of `result` / `error` / `openInterrupts` is meaningful,
        by `status`: `succeeded` → `result`; `failed` → `error`;
        `interrupted` → `openInterrupts` (non-empty); otherwise all are
        empty.
      required:
        - id
        - threadId
        - mode
        - status
        - parentRunId
        - previousRunId
        - openInterrupts
        - result
        - error
        - lastSeq
        - goal
        - maxSteps
        - step
        - createdAt
        - startedAt
        - finishedAt
        - updatedAt
        - rootRunId
        - currentRunId
        - research
        - delivered
        - childrenAsking
        - answerPending
      properties:
        id:
          type: string
          format: uuid
        threadId:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/RunMode"
        status:
          $ref: "#/components/schemas/RunStatus"
        parentRunId:
          type: [string, "null"]
          format: uuid
          description: The run that spawned this one as a separate (background) sub-agent run. Sub-agents that run inside a run appear in its stream as `SUBAGENT_*` events instead.
        previousRunId:
          type: [string, "null"]
          format: uuid
          description: The interrupted run this one answered (`forwardedProps.previousRunId`).
        openInterrupts:
          type: array
          description: What an `interrupted` run waits for; the same objects as its `RUN_FINISHED` interrupt outcome. Empty in every other status.
          items:
            $ref: "./agui/1.0/schema.json#/$defs/Interrupt"
        result:
          oneOf:
            - $ref: "#/components/schemas/RunResult"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/RunError"
            - type: "null"
        lastSeq:
          type: integer
          minimum: 0
          description: The highest log `seq` so far (0 before the first event, or after the log was purged).
        goal:
          type: [string, "null"]
          description: |
            Background-run progress: the task's title
            (`forwardedProps.goal`, else the last user message's text).
            Null for an interactive run.
        maxSteps:
          type: [integer, "null"]
          minimum: 1
          description: Background-run progress — the step budget. Null for an interactive run.
        step:
          type: [integer, "null"]
          minimum: 0
          description: |
            Background-run progress — the steps taken so far (0 before
            the first). Null for an interactive run.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
          description: When the run ended (`succeeded`, `failed`, `cancelled` or `interrupted`).
        updatedAt:
          type: string
          format: date-time
        rootRunId:
          type: string
          format: uuid
          description: |
            The task this run belongs to (0.5.0, Q69, Q75): its first run.
            A run that answered another (`previousRunId`) has that run's
            root, a sub-agent run its parent's; any other run is its own
            root (`rootRunId` = `id`). Interactive runs too: a chat turn
            and its answers.
        currentRunId:
          type: [string, "null"]
          format: uuid
          description: |
            Null when this run is its task's **current run** (Q75): the
            newest run of the task that holds its question — the root, or
            a run that answered it and is live, succeeded, or ended
            *after* applying the answers. Otherwise the id of the task's
            current run, which carries the task's status: set on an
            `interrupted` run a later run answered (follow it — the
            question is closed), and on a resume that failed or was
            cancelled before applying (a dead branch: its root's question
            is open again, with this failure as a note). A sub-agent run
            is answered in place (Q59), so it is always its own current
            run.
        research:
          type: boolean
          description: |
            A research run (`forwardedProps.research`, Q46); a resume has
            its previous run's. False for interactive runs.
        delivered:
          type: boolean
          description: |
            The task's result was marked delivered (`markRunDelivered`,
            Q77) — read from the task's root, so every run of the task
            agrees. False for interactive runs.
        childrenAsking:
          type: integer
          minimum: 0
          description: |
            How many of this run's sub-agent runs are `interrupted`,
            waiting on an answer (`answerRun`, Q59): one whose answer was
            accepted and not yet picked up (its `answerPending` is true)
            no longer counts — the question is answered. The parent
            itself reads `running` meanwhile.
        answerPending:
          type: boolean
          description: |
            An answer to this `interrupted` run was accepted and is
            queued, not yet picked up by a worker (`answerRun`, or the old
            task respond route): show the question as answered. False
            otherwise.

    AnswerRunRequest:
      type: object
      description: |
        The answers to a sub-agent run's open interrupts (`answerRun`):
        one AG-UI `ResumeEntry` per interrupt, as in a resume's
        `RunAgentInput.resume`.
      required: [resume]
      properties:
        resume:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "./agui/1.0/schema.json#/$defs/ResumeEntry"

    RunList:
      type: object
      required: [runs, nextPageToken]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        nextPageToken:
          type: [string, "null"]
          description: Pass back as `pageToken` for the next page; null on the last page.

    RunGapEventValue:
      type: object
      description: |
        The `value` of the `CUSTOM` event named `hummingbird.gap`: the
        requested cursor points at events the log no longer holds. The
        next event is always a `MESSAGES_SNAPSHOT` (id `resumeAt`, or no id
        when `resumeAt` is null) holding this run's output up to
        `resumeAt`; the stream then continues after it.
      required: [after, resumeAt, reason]
      properties:
        after:
          $ref: "#/components/schemas/RunCursor"
        resumeAt:
          type: [integer, "null"]
          minimum: 1
          description: The seq the snapshot covers up to (the compacted entry's seq); null when the whole log was purged.
        reason:
          type: string
          enum: [compacted, purged]
          description: "`compacted` — deltas were folded into the snapshot (Q17); `purged` — the log is gone after its retention window and the snapshot is empty (Q30)."

    RunRewindEventValue:
      type: object
      description: |
        The `value` of the `CUSTOM` event named `hummingbird.rewind`: a
        background run's worker died and another resumed it from the
        checkpoint at `after`. Discard every event received from this
        run's stream whose cursor seq is greater than `after` (they were
        the dead attempt's); the events that follow replace them.
      required: [after]
      properties:
        after:
          type: integer
          minimum: 0
  # --- end runs ----------------------------------------------------------------
