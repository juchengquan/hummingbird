[project]
name = "agent-py"
version = "0.1.0"
description = "Hummingbird agent service — Python implementation (Phase 0 scaffolding)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt[crypto]>=2.9.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    # Phase 3e: file extraction. Each lib is dynamic-imported in the
    # extraction module so the agent loop itself doesn't pay their
    # startup cost.
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "lxml>=5.0.0",
    "python-multipart>=0.0.9",
    "mcp>=1.27.2",
    "google-generativeai>=0.8.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # Upstream Starlette deprecation that triggers when FastAPI's
    # TestClient imports it; harmless and out of our control.
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.mypy]
python_version = "3.12"
strict = true

# asyncpg ships without a py.typed marker upstream and there's no
# `types-asyncpg` on PyPI. Until they ship stubs, treat its module as
# Any rather than fail every import.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# pypdf + python-docx + openpyxl + lxml — extraction libs. Some ship
# stubs in separate packages we'd rather not add; lxml's stubs are
# notoriously incomplete. Treat as Any at the import boundary; we
# wrap their narrow surface in our own types.
[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*", "docx", "docx.*", "openpyxl", "openpyxl.*", "lxml", "lxml.*"]
ignore_missing_imports = true
